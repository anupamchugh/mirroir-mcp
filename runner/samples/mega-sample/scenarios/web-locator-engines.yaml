version: 1
name: web — role= and text= locator engines across all three browsers
steps:
  - spawn: { id: session, from: SAMPLE.md }
  - target: { kind: web, browsers: [chrome, firefox, webkit], url: "http://127.0.0.1:18898/" }
  # Exercise the Playwright locator-engine passthrough end-to-end: role= (by
  # ARIA role + accessible name) and text= (substring) must resolve in a real
  # browser run, not just compile.
  - assert_visible: "role=heading[name=\"Directory listing for /\"]"
  - assert_visible: "role=link[name=\"scenarios/\"]"
  - assert_visible: "text=SAMPLE.md"
